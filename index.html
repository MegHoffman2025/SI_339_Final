<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <title>Recipe Finder</title>
</head>
<body>
    <header>
        <a class = "skip" href="#skip">Skip to Main Content</a>      
        <nav>
            <span class="material-symbols-outlined" id="menu">menu</span>
            <div id="links">
                <div class="left-nav">
                    <a href="index.html" class="current">Recipes</a>
                    <a href="discover.html">Discover</a>
                </div>
                <div class="right-nav">
                    <a href="profile.html">Meghan Hoffman</a>
                    <a href="" class="log-out-button">Log Out</a>
                </div>
            </div>
        </nav>
        <h1>Recipes</h1>
    </header>
    <main id="#skip">
        <div class="add-recipe">
            <span class="material-symbols-outlined">add</span>
        </div>
        <div class="form-popup" id="recipeForm">
            <form name='recipeForm' class="form-container">
          
                <label for="recipeName"><b>Title</b></label>
                <input type="text" placeholder="Enter Recipe" name="recipeName" required>
          
                <label for="recipeSource"><b>Recipe Source</b></label>
                <input type="text" placeholder="Enter Recipe Source" name="recipeSource" required>

                <label for="recipeCookTime"><b>Cook Time</b></label>
                <input type="text" placeholder="Enter Cook Time" name="recipeCookTime">

                <label for="recipeIngredients"><b>Ingredients</b></label>
                <input type="text-field" placeholder="Enter Ingredients" name="recipeIngredients">

                <label for="recipeInstructions"><b>Instructions</b></label>
                <input type="text-field" placeholder="Enter Instructions" name="recipeInstructions">
          
                <label for="recipePhoto"><b>Photo</b></label>
                <input type="file" name="recipePhoto" id="file-upload">

                <div class="decisions">
                    <button type="button" class="cancel-recipe">Close</button>
                    <button type="button" class="recipe-submit">Save Recipe</button>
                </div>
            </form>
          </div>
        <section class="all-recipes">
            <div class="recipes-header">
                <h2>All Recipes</h2>
                <input type="text" placeholder="Search" name="search" id="myInput" onkeyup="filterFunction()">    
            </div>
            <div class="cards"></div>
        </section>
    </main>
    <footer>
        <p>This is a website to help you reach all of your cooking goals</p>
    </footer>
</body>
<script src="js/script.js"></script>
</html>
